<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICHIKAZU SASHIE | 創作のページ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap wrap--top">
    <section class="hero">
      <h1 class="hero-name">MICHIKAZU<br>SASHIE</h1>
      <p class="hero-sub">小説・映像・イラスト ── 作品ごとに世界観をまとめています。</p>
    </section>
  </div>

  <div class="hero-banner">
    <img class="slide active" src="assets/slide1.png" alt="">
    <img class="slide" src="assets/slide2.png" alt="">
  </div>

  <div class="wrap wrap--bottom">
    <section class="works">
      <h2 class="section-title">WORKS</h2>

      <div class="work-grid">

        <a class="work-card" href="works/star-wars-evil-paladin/index.html">
          <span class="work-num">001</span>
          <div class="work-thumb">
            <img src="assets/work-star-wars-evil-paladin.jpg" alt="STAR WARS: EVIL PALADIN">
          </div>
          <div class="work-info">
            <h3 class="work-title">STAR WARS:<br>EVIL PALADIN</h3>
            <p class="work-tags">NOVEL / FILM — Fan Fiction</p>
          </div>
        </a>

        <a class="work-card" href="works/fate-no-one-out-of-twelve/index.html">
          <span class="work-num">002</span>
          <div class="work-thumb">
            <img src="assets/work-fate.png" alt="Fate／Last One Standing">
          </div>
          <div class="work-info">
            <h3 class="work-title">FATE:<br>LAST ONE<br>STANDING</h3>
            <p class="work-tags">NOVEL — Fan Fiction</p>
          </div>
        </a>

        <div class="work-card is-placeholder">
          <span class="work-num">003</span>
          <div class="work-thumb work-thumb--empty">
            <span>COMING SOON</span>
          </div>
          <div class="work-info">
            <h3 class="work-title">NEXT WORK</h3>
            <p class="work-tags">準備中</p>
          </div>
        </div>

      </div>
    </section>

    <section class="contact">
      <h2 class="section-title">CONTACT</h2>
      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="4cd41e67-b5e9-4e5f-ba2a-5b95522fac04">
        <div class="cf-field">
          <label class="cf-label">お名前</label>
          <input class="cf-input" type="text" name="name" placeholder="Name" required>
        </div>
        <div class="cf-field">
          <label class="cf-label">メールアドレス</label>
          <input class="cf-input" type="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="cf-field">
          <label class="cf-label">メッセージ</label>
          <textarea class="cf-input cf-textarea" name="message" placeholder="Message" required></textarea>
        </div>
        <button class="cf-submit" type="submit">SEND</button>
      </form>
    </section>

    <footer class="site-footer">
      &copy; 2026 MICHIKAZU SASHIE
    </footer>
  </div>

<script>
const slides = document.querySelectorAll('.hero-banner .slide');
let cur = 0;
setInterval(() => {
  slides[cur].classList.remove('active');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('active');
}, 2000);
</script>
</body>
</html>
